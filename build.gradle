plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.puron'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // JWT (액세스 토큰 5분 + Redis 리프레시 — environment-setup-plan.md 3절)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    runtimeOnly 'org.postgresql:postgresql'

    // QueryDSL (Jakarta 버전) — environment-setup-plan.md 4절, 동적 쿼리(조건별 검색/정렬/페이징) 타입 안전 빌더
    implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'
    annotationProcessor 'com.querydsl:querydsl-apt:5.0.0:jakarta'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api:3.1.0'

    // MyBatis — environment-setup-plan.md 3절, 복잡한 SQL(통계성 쿼리/다중 조인/서브쿼리) 전담 (JPA/QueryDSL은 기본 CRUD·동적 쿼리 담당)
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.4'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // module-boundary-guide.md 6절 — 도메인 간 api/internal 경계를 ArchUnit으로 2차 방어
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// QueryDSL Q클래스 생성 경로 — environment-setup-plan.md 4절 (src/main/generated, 버전 관리 대상 아님)
tasks.named('compileJava').configure {
    options.annotationProcessorGeneratedSourcesDirectory = file("${projectDir}/src/main/generated")
}
